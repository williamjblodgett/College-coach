<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e14">
  <meta name="description" content="Gridiron Dynasty — a college football head-coaching career simulator.">
  <title>Gridiron Dynasty</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app"><noscript>Gridiron Dynasty requires JavaScript.</noscript></main>

  <!-- data + engine + ui (plain scripts, no build step) -->
  <script src="js/data/teams.js"></script>
  <script src="js/data/teams-fbs.js"></script>
  <script src="js/data/current-power.js"></script>
  <script src="js/data/lower-division-tools.js"></script>
  <script src="js/data/teams-fcs.js"></script>
  <script src="js/data/teams-d2.js"></script>
  <script src="js/data/teams-d3.js"></script>
  <script src="js/data/lower-divisions.js"></script>
  <script src="js/data/coaches.js"></script>
  <script src="js/data/names.js"></script>
  <script src="js/registry.js"></script>
  <script src="js/difficulty.js"></script>
  <script src="js/crests.js"></script>
  <script src="js/saves.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/football.js"></script>
  <script src="js/story.js"></script>
  <script src="js/world.js"></script>
  <script src="js/tactics.js"></script>
  <script src="js/staff.js"></script>
  <script src="js/scandal.js"></script>
  <script src="js/cases.js"></script>
  <script src="js/program.js"></script>
  <script src="js/career.js"></script>
  <script src="js/season.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ui.js"></script>
  <script>
    (function () {
      'use strict';
      // Boot: load any save into memory so "Continue Career" works, but always
      // land on the title menu (Continue / New / Import) as the entry point.
      try { window.GameEngine.load(); } catch (e) {}
      window.GameUI.renderTitle();
      if (window.GameSaves) window.GameSaves.init();
      if (window.GamePWA) window.addEventListener('load', function () { window.GamePWA.init(); });
    })();
  </script>
</body>
</html>
