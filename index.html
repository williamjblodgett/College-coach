<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e14">
  <meta name="description" content="Gridiron Dynasty — a college football head-coaching career simulator.">
  <title>Gridiron Dynasty</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app"><noscript>Gridiron Dynasty requires JavaScript.</noscript></main>

  <!-- data + engine + ui (plain scripts, no build step) -->
  <script src="js/data/teams.js"></script>
  <script src="js/data/teams-fbs.js"></script>
  <script src="js/data/coaches.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/season.js"></script>
  <script src="js/ui.js"></script>
  <script>
    (function () {
      'use strict';
      // Boot: load any save into memory so "Continue Career" works, but always
      // land on the title menu (Continue / New / Import) as the entry point.
      try { window.GameEngine.load(); } catch (e) {}
      window.GameUI.renderTitle();

      // PWA: register a network-first service worker with one-time auto-reload
      // on activation of a new version.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js').then(function (reg) {
            reg.addEventListener('updatefound', function () {
              var nw = reg.installing;
              if (!nw) return;
              nw.addEventListener('statechange', function () {
                if (nw.state === 'activated' && navigator.serviceWorker.controller &&
                    !sessionStorage.getItem('gd-reloaded')) {
                  sessionStorage.setItem('gd-reloaded', '1');
                  location.reload();
                }
              });
            });
          }).catch(function () {});
        });
      }
    })();
  </script>
</body>
</html>
