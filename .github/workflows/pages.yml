name: Deploy to GitHub Pages

# Deploys the static site on every push to the working branch or main.
# One-time setup: repo Settings → Pages → Source = "GitHub Actions".
on:
  push:
    branches:
      - main
      - claude/gridiron-dynasty-plan-rhr20i
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        # Requires a one-time repo setup: Settings → Pages → Source =
        # "GitHub Actions" (the default token can't provision Pages itself).
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repo root is the static site (no build step).
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
